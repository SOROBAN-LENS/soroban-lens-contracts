[package]
name = "scenario-runner"
description = "Executes the SorobanLens fixture catalog against the example contracts and verifies the expected outcomes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Must match the exact version soroban-sdk pins (soroban-sdk 29.0.1 -> =29.0.1).
# Used only to call `Host::call` directly so the runner observes the granular
# host error instead of the `Error(Context, InvalidAction)` that the SDK's
# `try_*` helpers narrow non-contract errors to.
soroban-env-host = { version = "=29.0.1", features = ["testutils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

auth-guard = { path = "../../contracts/auth-guard", features = ["testutils"] }
input-validator = { path = "../../contracts/input-validator", features = ["testutils"] }
execution-failure = { path = "../../contracts/execution-failure", features = ["testutils"] }
